name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: git archive --format=zip -o watchtower-ios-$GITHUB_REF_NAME.zip HEAD
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'watchtower-ios-*.zip'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" watchtower-ios-*.zip --generate-notes --verify-tag
      # CocoaPods trunk: runs only when the owner has set COCOAPODS_TRUNK_TOKEN. SwiftPM needs
      # nothing here: the v* tag on this repository is the release.
      - name: CocoaPods trunk
        if: ${{ env.COCOAPODS_TRUNK_TOKEN != '' }}
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then echo "COCOAPODS_TRUNK_TOKEN not set; skipping"; exit 0; fi
          sed -i '' "s/s.version .*/s.version       = '${GITHUB_REF_NAME#v}'/" WatchtowerSDK.podspec
          pod trunk push WatchtowerSDK.podspec --allow-warnings
