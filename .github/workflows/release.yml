name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift test
      - run: git archive --format=zip -o watchtower-ios-$GITHUB_REF_NAME.zip HEAD
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'watchtower-ios-*.zip'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" watchtower-ios-*.zip --generate-notes --verify-tag
